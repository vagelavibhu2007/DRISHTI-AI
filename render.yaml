services:
  - type: web
    name: drishti-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ML_MODE
        value: real
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
